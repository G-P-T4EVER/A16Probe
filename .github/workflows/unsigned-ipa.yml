name: Build and verify unsigned IPA

on:
  push:
    branches: [main, 'research/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build, test, package and verify
        run: ./scripts/build_unsigned.sh
      - name: Upload verified unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: A16Probe-unsigned-${{ github.sha }}
          path: |
            build/A16Probe-unsigned.ipa
            build/A16Probe-unsigned.ipa.sha256
            build/ipa-verification.json
            build/toolchain.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: A16Probe-build-logs-${{ github.sha }}
          path: |
            build/*.log
            build/toolchain.txt
          if-no-files-found: warn
          retention-days: 14
